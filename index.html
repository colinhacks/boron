<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately not device-width: Boron has no mobile layout. Phones lay it
         out at 900px and scale to fit, and you pinch-zoom to the part you want. -->
    <meta name="viewport" content="width=900" />

    <title>Boron — beautiful images of your terminal</title>
    <meta
      name="description"
      content="Compose a terminal session, keep its ANSI colors, and export it as a PNG, SVG, JPEG or WebP. Paste real output, copy it back out as ANSI or chalk."
    />
    <link rel="canonical" href="https://boron.sh/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08090d" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://boron.sh/" />
    <meta property="og:site_name" content="Boron" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Boron — beautiful images of your terminal" />
    <meta
      property="og:description"
      content="Compose a terminal session, keep its ANSI colors, and export it as an image."
    />
    <meta property="og:image" content="https://boron.sh/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Boron spelled out in rainbow terminal cells, beside a terminal window showing a dev server starting with coloured output, underlined links and a green READY badge" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boron — beautiful images of your terminal" />
    <meta
      name="twitter:description"
      content="Compose a terminal session, keep its ANSI colors, and export it as an image."
    />
    <meta name="twitter:image" content="https://boron.sh/og.png" />
    <meta name="twitter:image:alt" content="Boron spelled out in rainbow terminal cells, beside a terminal window showing a dev server starting with coloured output, underlined links and a green READY badge" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Boron",
        "url": "https://boron.sh/",
        "description": "Compose a terminal session, keep its ANSI colors, and export it as an image.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
