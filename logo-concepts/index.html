<!doctype html>
<html><head><meta charset="utf-8"><title>Boron logo concepts</title>
<style>
  body { background:#08090d; color:#e7eaf2; font:14px ui-sans-serif,-apple-system,system-ui,sans-serif; margin:0; padding:40px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 4px; }
  p.sub { color:#949cb0; margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:32px; max-width:1000px; }
  .card { background:#0e1016; border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:20px; }
  .row { display:flex; align-items:center; gap:20px; margin-bottom:16px; }
  .row img.lg { width:96px; height:96px; }
  .row img.md { width:40px; height:40px; }
  .row img.sm { width:20px; height:20px; }
  .name { color:#949cb0; font-size:12px; }
</style></head><body>
<h1>Boron — logo concepts</h1>
<p class="sub">Each mark shown at 96px, 40px and 20px, so the ones that collapse at favicon size are obvious.</p>
<div class="grid">
  <div class="card">
    <div class="row">
      <img class="lg" src="01-element-tile.svg" alt="1 · Element tile — B is 5, carbon is 6">
      <img class="md" src="01-element-tile.svg" alt="">
      <img class="sm" src="01-element-tile.svg" alt="">
    </div>
    <div class="name">1 · Element tile — B is 5, carbon is 6</div>
  </div>
  <div class="card">
    <div class="row">
      <img class="lg" src="02-chevron-b.svg" alt="2 · Chevron-B — bowls are prompt markers">
      <img class="md" src="02-chevron-b.svg" alt="">
      <img class="sm" src="02-chevron-b.svg" alt="">
    </div>
    <div class="name">2 · Chevron-B — bowls are prompt markers</div>
  </div>
  <div class="card">
    <div class="row">
      <img class="lg" src="03-prompt-cursor.svg" alt="3 · Prompt + cursor">
      <img class="md" src="03-prompt-cursor.svg" alt="">
      <img class="sm" src="03-prompt-cursor.svg" alt="">
    </div>
    <div class="name">3 · Prompt + cursor</div>
  </div>
  <div class="card">
    <div class="row">
      <img class="lg" src="04-icosahedron.svg" alt="4 · B12 icosahedron">
      <img class="md" src="04-icosahedron.svg" alt="">
      <img class="sm" src="04-icosahedron.svg" alt="">
    </div>
    <div class="name">4 · B12 icosahedron</div>
  </div>
  <div class="card">
    <div class="row">
      <img class="lg" src="05-grid-b.svg" alt="5 · Grid B on terminal cells">
      <img class="md" src="05-grid-b.svg" alt="">
      <img class="sm" src="05-grid-b.svg" alt="">
    </div>
    <div class="name">5 · Grid B on terminal cells</div>
  </div>
  <div class="card">
    <div class="row">
      <img class="lg" src="06-spectrum-b.svg" alt="6 · Spectrum B">
      <img class="md" src="06-spectrum-b.svg" alt="">
      <img class="sm" src="06-spectrum-b.svg" alt="">
    </div>
    <div class="name">6 · Spectrum B</div>
  </div>
</div>
</body></html>
